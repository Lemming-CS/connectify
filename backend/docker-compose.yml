services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connectify
      POSTGRES_USER: connectify
      POSTGRES_PASSWORD: connectify
    ports:
      - "5432:5432"
    volumes:
      - connectify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectify -d connectify"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      CONNECTIFY_ENVIRONMENT: development
      CONNECTIFY_DATABASE_URL: postgresql+psycopg2://connectify:connectify@db:5432/connectify
      CONNECTIFY_SECRET_KEY: replace-with-a-long-random-secret
      CONNECTIFY_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  connectify-postgres:
